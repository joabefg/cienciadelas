<!DOCTYPE html>
<html lang="pt-br">

<head>
     <meta charset="UTF-8">
     <title>Projeto Ciência Delas (Nome Provisório)</title>
     <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
     <!-- CSS -->
     <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/modelo.css') }}">
</head>

<body>

     {% include 'header.html' %}

     <main class="container my-4">
          <h1>Pagina Modelo</h1>
          <form action="/modelo" method="post">
               <input class="form-control mb-2" type="text" name="atributo">
               <input class="form-control mb-2" type="date" name="criacao">
               <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
          <table class="table">
               <thead>
                    <tr>
                         <th scope="col">#</th>
                         <th scope="col">Atributo</th>
                         <th scope="col">Data</th>
                    </tr>
               </thead>
               <tbody>
                    {% for modelo in lista %}
                    <tr>
                         <td>{{ modelo[0] }}</td>
                         <td>{{ modelo[1] }}</td>
                         <td>{{ modelo[2] }}</td>
                    </tr>
                    {% endfor %}
               </tbody>
          </table>
     </main>

     {% include 'footer.html' %}

     <script src="include.js"></script>
     <!-- Bootstrap JS (bundle inclui Popper) -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
