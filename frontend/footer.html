<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }

        /* RODAPÉ */
        .site-footer { position: relative; width: 100%; height: 206px; background-color: #7189ba; color: #2d4983; overflow: hidden; }

        /* CONTATO */
        .footer-contact { position: absolute; left: 19px; bottom: 14px; display: flex; flex-direction: column; line-height: 1.25; font-family: Arial, Helvetica, sans-serif; }
        .footer-contact h3 { margin: 0 0 3px 0; font-family: "Press Start 2P", monospace; font-size: 14px; font-weight: normal; color: #ffffff; }
        .footer-contact a { color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 600; margin: 0; }
        .footer-contact a:hover { text-decoration: underline; }

        /* CENTRO */
        .footer-center { position: absolute; top: 0; left: 50%; width: max-content; transform: translateX(-50%); text-align: center; }
        .footer-title { margin-top: 67px; color: #2d4983; font-family: "Press Start 2P", monospace; font-size: 38px; line-height: 1; white-space: nowrap; }
        .footer-senai { margin-top: 43px; color: #2d4983; font-family: "Press Start 2P", monospace; font-size: 18px; font-weight: bold; line-height: 1; }

        /* REDES SOCIAIS */
        .footer-social { position: absolute; top: 94px; right: 52px; display: flex; align-items: center; gap: 19px; }
        .footer-social a { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; color: #2d4983; text-decoration: none; font-size: 18px; transition: opacity 0.2s ease; }
        .footer-social a:hover { opacity: 0.7; }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .site-footer { height: 250px; }
            .footer-title { margin-top: 45px; font-size: 25px; }
            .footer-senai { margin-top: 35px; font-size: 15px; }
            .footer-social { top: auto; bottom: 25px; right: 50%; transform: translateX(50%); }
            .footer-contact { left: 20px; bottom: 25px; }
        }

        @media (max-width: 480px) {
            .site-footer { height: 290px; }
            .footer-title { font-size: 20px; }
            .footer-senai { font-size: 13px; }
            .footer-contact { left: 15px; }
        }
    </style>
    <footer class="site-footer">

        <div class="footer-contact">
            <h3>Contato</h3>
            <a href="tel:+556199999999">61 9999-9999</a>
            <a href="https://www.instagram.com/ciencia.delas/" target="_blank" rel="noopener noreferrer">@ciencia.delas</a>
            <a href="mailto:cienciadelas@gmail.com">cienciadelas@gmail.com</a>
        </div>

        <div class="footer-center">
            <div class="footer-title">CIÊNCIA DELAS</div>
            <img src="./senai.png"alt="Logo SENAI" width="70">
        </div>

        <div class="footer-social">
            <a href="https://www.instagram.com/ciencia.delas/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="X"><i class="bi bi-twitter-x"></i></a>
            <a href="mailto:cienciadelas@gmail.com" aria-label="E-mail"><i class="bi bi-envelope"></i></a>
        </div>

    </footer>
    </head>
